<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <title>DBD Flashcards | Dead by Daylight Perk & Add-On Study Tool</title>

        <meta
            name="description"
            content="Learn every Dead by Daylight perk and add-on with free flashcards. Browse Killer and Survivor perks and add-ons, then quiz yourself to test your knowledge."
        />
        <link
            rel="canonical"
            href="https://dbdflashcards.com/"
        />
        <meta
            name="theme-color"
            content="#111111"
        />

        <!-- Favicons -->
        <link
            rel="icon"
            href="/favicon.ico"
            sizes="any"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/favicon-192.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/favicon-512.png"
        />
        <link
            rel="apple-touch-icon"
            href="/apple-touch-icon.png"
        />

        <!-- Open Graph -->
        <meta
            property="og:site_name"
            content="DBD Flashcards"
        />
        <meta
            property="og:title"
            content="DBD Flashcards | Dead by Daylight Perk & Add-On Study Tool"
        />
        <meta
            property="og:description"
            content="Learn every Dead by Daylight perk and add-on with free flashcards. Browse Killer and Survivor perks and add-ons, then quiz yourself to test your knowledge."
        />
        <meta
            property="og:type"
            content="website"
        />
        <meta
            property="og:url"
            content="https://dbdflashcards.com/"
        />
        <meta
            property="og:locale"
            content="en_US"
        />
        <meta
            property="og:image"
            content="https://dbdflashcards.com/og-image.jpg"
        />
        <meta
            property="og:image:type"
            content="image/jpeg"
        />
        <meta
            property="og:image:width"
            content="1200"
        />
        <meta
            property="og:image:height"
            content="630"
        />
        <meta
            property="og:image:alt"
            content="DBD Flashcards logo"
        />

        <!-- X / Twitter -->
        <meta
            name="twitter:card"
            content="summary_large_image"
        />
        <meta
            name="twitter:title"
            content="DBD Flashcards | Dead by Daylight Perk & Add-On Study Tool"
        />
        <meta
            name="twitter:description"
            content="Learn every Dead by Daylight perk and add-on with free flashcards. Browse Killer and Survivor perks and add-ons, then quiz yourself to test your knowledge."
        />
        <meta
            name="twitter:image"
            content="https://dbdflashcards.com/og-image.jpg"
        />
        <meta
            name="twitter:image:alt"
            content="DBD Flashcards logo"
        />

        <!-- Structured data: lets Google show "DBD Flashcards" as the site name -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "DBD Flashcards",
                "alternateName": "Dead by Daylight Flashcards",
                "url": "https://dbdflashcards.com/",
                "description": "An unofficial Dead by Daylight study tool for learning every perk and add-on."
            }
        </script>
    </head>

    <body>
        <div id="app"></div>

        <script
            type="module"
            src="/src/main.ts"
        ></script>
    </body>
</html>
