<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <title>DBD Flashcards | Dead by Daylight Perk & Add-On Study Tool</title>

        <meta
            name="description"
            content="Learn every Dead by Daylight perk and add-on with free flashcards. Browse Killer and Survivor perks and add-ons, then quiz yourself to test your knowledge."
        />
        <link
            rel="canonical"
            href="https://dbdflashcards.com/"
        />
        <meta
            name="theme-color"
            content="#111111"
        />

        <!-- Favicons -->
        <link
            rel="icon"
            href="/favicon.ico"
            sizes="any"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/favicon-192.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/favicon-512.png"
        />
        <link
            rel="apple-touch-icon"
            href="/apple-touch-icon.png"
        />

        <!-- Open Graph -->
        <meta
            property="og:site_name"
            content="DBD Flashcards"
        />
        <meta
            property="og:title"
            content="DBD Flashcards | Dead by Daylight Perk & Add-On Study Tool"
        />
        <meta
            property="og:description"
            content="Learn every Dead by Daylight perk and add-on with free flashcards. Browse Killer and Survivor perks and add-ons, then quiz yourself to test your knowledge."
        />
        <meta
            property="og:type"
            content="website"
        />
        <meta
            property="og:url"
            content="https://dbdflashcards.com/"
        />
        <meta
            property="og:locale"
            content="en_US"
        />
        <meta
            property="og:image"
            content="https://dbdflashcards.com/og-image-v2.jpg"
        />
        <meta
            property="og:image:type"
            content="image/jpeg"
        />
        <meta
            property="og:image:width"
            content="1200"
        />
        <meta
            property="og:image:height"
            content="630"
        />
        <meta
            property="og:image:alt"
            content="DBD Flashcards logo"
        />

        <!-- X / Twitter -->
        <meta
            name="twitter:card"
            content="summary_large_image"
        />
        <meta
            name="twitter:title"
            content="DBD Flashcards | Dead by Daylight Perk & Add-On Study Tool"
        />
        <meta
            name="twitter:description"
            content="Learn every Dead by Daylight perk and add-on with free flashcards. Browse Killer and Survivor perks and add-ons, then quiz yourself to test your knowledge."
        />
        <meta
            name="twitter:image"
            content="https://dbdflashcards.com/og-image-v2.jpg"
        />
        <meta
            name="twitter:image:alt"
            content="DBD Flashcards logo"
        />

        <!-- Prerendered pages put a plain <article> in #app for crawlers (see renderPage in
             vite.config.ts). Vue replaces it on mount; hide it until then so visitors don't see
             it flash unstyled. Without JavaScript it's the only content, so it shows. -->
        <style>
            #app > article {
                display: none;
            }

            /* Loading flashcard: a gold card flipping in the middle of the screen until Vue mounts
               (Vue adds data-v-app to #app then, so this stops matching). It waits 200ms before
               fading in, so fast loads never show it. */
            #app:not([data-v-app]) {
                display: grid;
                place-items: center;
                min-height: 100vh;
            }
            #app:not([data-v-app])::before {
                content: '';
                width: 4.5rem;
                height: 6rem;
                border-radius: 0.75rem;
                border: 2px solid var(--standard-gold, #ffd700);
                background: color-mix(in srgb, var(--standard-gold, #ffd700) 12%, transparent);
                box-shadow: 0 0 1.5rem color-mix(in srgb, var(--standard-gold, #ffd700) 25%, transparent);
                animation:
                    boot-fade-in 0.3s ease 0.2s both,
                    boot-flip 1.4s cubic-bezier(0.65, 0, 0.35, 1) 0.2s infinite;
            }
            @keyframes boot-fade-in {
                from {
                    opacity: 0;
                }
            }
            @keyframes boot-flip {
                from {
                    transform: perspective(30rem) rotateY(0);
                }
                to {
                    transform: perspective(30rem) rotateY(360deg);
                }
            }
            /* No flipping for reduced motion: the card just breathes */
            @media (prefers-reduced-motion: reduce) {
                #app:not([data-v-app])::before {
                    animation:
                        boot-fade-in 0.3s ease 0.2s both,
                        boot-pulse 1.6s ease-in-out 0.2s infinite alternate;
                }
            }
            @keyframes boot-pulse {
                to {
                    opacity: 0.4;
                }
            }
        </style>
        <noscript>
            <!-- No JavaScript: show the prerendered text and drop the loader, which would spin forever -->
            <style>
                #app > article {
                    display: block;
                }
                #app:not([data-v-app]) {
                    display: block;
                    min-height: 0;
                }
                #app:not([data-v-app])::before {
                    content: none;
                }
            </style>
        </noscript>

        <!-- Structured data: lets Google show "DBD Flashcards" as the site name -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "DBD Flashcards",
                "alternateName": "Dead by Daylight Flashcards",
                "url": "https://dbdflashcards.com/",
                "description": "An unofficial Dead by Daylight study tool for learning every perk and add-on."
            }
        </script>
    </head>

    <body>
        <div id="app"></div>

        <script
            type="module"
            src="/src/main.ts"
        ></script>
    </body>
</html>
