<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta

        <meta
            name="description"
            content="An unofficial Dead by Daylight study tool!"
        />

        <!-- Favicons -->
        <link
            rel="icon"

        />

        />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"

        <meta
            property="og:title"
            content="DBD Flashcards"
        />
        <meta

            content="An unofficial Dead by Daylight study tool!"
